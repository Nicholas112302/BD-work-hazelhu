name: Deploy Nico Workbench to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'nico-workbench-deploy/**'
      - '.github/workflows/nico-workbench-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nico-workbench-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Nico Workbench artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: nico-workbench-deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
