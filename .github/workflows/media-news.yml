name: Update Media News Radar

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update media news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MEDIA_NEWS_MAX_CANDIDATES: '40'
          MEDIA_NEWS_MAX_DEEP_ITEMS: '8'
          MEDIA_NEWS_MODEL: gpt-5.6-luna
        run: node scripts/update-media-news.mjs

      - name: Commit updated news when changed
        run: |
          if git diff --quiet -- nico-workbench-deploy/news.json; then
            echo "No news changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nico-workbench-deploy/news.json
          git commit -m "chore: update media news radar"
          git push origin HEAD:main
